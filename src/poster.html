<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G25 - Tools (For LATAM/North Americans)</title>
<style>
:root {
  color-scheme: dark;
  --accent: #86a846;
  --accent-light: #b3c88b;
  --cream: #f1dfc4;
  --muted: #afb6a5;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at 50% -10%, #32372b 0, #191b17 43%, #0e100f 80%);
  color: var(--cream);
  font: 15px system-ui, -apple-system, 'Segoe UI', sans-serif;
}
.wrap { max-width: 1200px; margin: auto; padding: 24px 22px 44px; }
.topline, .poster-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.topline { margin-bottom: 16px; }
.brand { margin: 0; font: bold 26px Georgia, serif; color: #ecdfc6; }
.eyebrow { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent-light); margin-bottom: 4px; }
.controls {
  padding: 19px;
  margin-bottom: 16px;
  border: 1px solid #53603e;
  border-radius: 18px;
  background: linear-gradient(160deg, #282c25, #151713);
  box-shadow: 0 12px 40px #0006;
}
.controlgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
.wide { grid-column: 1 / -1; }
label { display: block; margin-bottom: 6px; color: #d5dec6; font-size: 13px; font-weight: 600; }
input[type=text], textarea, select {
  width: 100%;
  padding: 10px 12px;
  background: #101310;
  color: #f4ebdc;
  border: 1px solid #58634d;
  border-radius: 8px;
  font: inherit;
}
select { padding-right: 25px; font-size: 14px; }
textarea {
  display: block;
  min-height: 80px;
  resize: vertical;
  white-space: pre;
  tab-size: 2;
  font: 13px/1.5 'SFMono-Regular', Consolas, monospace;
}
.language select { min-width: 130px; }
:focus-visible { outline: 2px solid var(--accent-light); outline-offset: 3px; }
.helper { margin: 7px 0 0; font-size: 12px; line-height: 1.55; color: var(--muted); }
.calculator-picker {
  min-width: 0;
  margin: 14px 0 0;
  padding: 7px 12px 10px;
  border: 1px solid #49533e;
  border-radius: 9px;
}
.calculator-picker legend { padding: 0 5px; color: #d5dec6; font-size: 13px; font-weight: 650; }
.calculator-options { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.calculator-choice {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 34px;
  margin: 0;
  cursor: pointer;
}
.calculator-choice input {
  appearance: none;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  margin: 0;
  background: #101310;
  border: 1px solid #708063;
  border-radius: 4px;
  cursor: pointer;
}
.calculator-choice input:checked { background: var(--accent); border-color: var(--accent-light); }
.calculator-choice input:checked::before { content: '×'; color: #0f160d; font: bold 16px/1 system-ui, sans-serif; }
@media (forced-colors: active) {
  .calculator-choice input { appearance: auto; }
  .calculator-choice input:checked::before { content: none; }
}
.actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
button {
  min-height: 41px;
  padding: 9px 14px;
  cursor: pointer;
  border: 1px solid #67745b;
  border-radius: 9px;
  background: #232922;
  color: #edf1e5;
  font: 650 13px system-ui, sans-serif;
}
button.primary { background: var(--accent); color: #0f160d; border-color: var(--accent-light); }
button:hover:not(:disabled) { filter: brightness(1.12); }
button:disabled { opacity: .5; cursor: default; }
button[aria-pressed=true] { border-color: var(--accent-light); }
.status { margin: 11px 0 0; padding: 9px 12px; background: #151b14; color: #d7e4cb; border-left: 3px solid var(--accent); border-radius: 6px; font-size: 13px; line-height: 1.5; }
.status.err { background: #352020; color: #ffd2c7; border-color: #d67064; }
details { margin-top: 13px; border: 1px solid #49533e; border-radius: 9px; background: #131713; }
summary { cursor: pointer; padding: 11px 13px; color: #e4eadb; font-size: 13px; font-weight: 650; }
.source-editor { padding: 0 13px 13px; }
.source-editor label { margin-top: 12px; }
.source-count { color: #b4bea6; font-size: 12px; font-weight: 400; }
.source-count.err, .photo-error { color: #ffc4b6; }
.appearance { border-top: 1px solid #46503d; margin-top: 15px; padding-top: 14px; }
.option-row { display: flex; align-items: center; gap: 8px; }
.option-row select { min-width: 0; flex: 1; }
.swatch { width: 15px; height: 15px; flex-shrink: 0; background: var(--accent); border: 1px solid #f1dfc455; border-radius: 50%; }
.custom-option { margin-top: 9px; }
input[type=color] { width: 48px; height: 34px; padding: 2px; background: #111511; border: 1px solid #58634d; border-radius: 6px; cursor: pointer; }
.photo-message { margin: 5px 0 0; overflow-wrap: anywhere; }
.poster-tools { justify-content: flex-end; margin: 0 0 8px; }
.posterframe { border: 1px solid #4d573c; background: #0f0f0f; overflow: auto; border-radius: 14px; box-shadow: 0 14px 60px #0009; }
.posterframe canvas { display: block; width: 100%; height: auto; max-width: 1122px; margin: auto; }
.posterframe canvas.zoom { width: max(880px, 125%); max-width: none; }
.note { text-align: center; color: #aeb4aa; font-size: 12px; margin: 14px 0 0; line-height: 1.6; }
@media (max-width: 610px) {
  .wrap { padding: 13px 10px 28px; }
  .brand { font-size: 21px; }
  .controls { padding: 13px; }
  .editor-grid { grid-template-columns: 1fr; }
  .poster-tools { justify-content: flex-start; gap: 6px; }
  button { padding-inline: 11px; }
}
@media (max-width: 360px) {
  .appearance { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main class="wrap">
  <header class="topline">
    <div>
      <div class="eyebrow" data-text="eyebrow"></div>
      <h1 class="brand">G25 - Tools (For LATAM/North Americans)</h1>
    </div>
    <div class="language">
      <label for="language">Idioma / Language</label>
      <select id="language">
        <option value="pt-BR">Português</option>
        <option value="en">English</option>
      </select>
    </div>
  </header>

  <section class="controls" data-aria="settings">
    <div class="controlgrid editor-grid">
      <div>
        <label for="titleInput" data-text="titleLabel"></label>
        <input id="titleInput" type="text">
      </div>
      <div>
        <label for="subtitleInput" data-text="subtitleLabel"></label>
        <input id="subtitleInput" type="text" data-placeholder="optionalTitle">
      </div>
      <div class="wide">
        <label for="thirdTitleInput" data-text="thirdTitleLabel"></label>
        <input id="thirdTitleInput" type="text" data-placeholder="optionalTitle">
      </div>
      <div class="wide">
        <label for="targetInput" data-text="targetLabel"></label>
        <textarea id="targetInput" spellcheck="false" data-placeholder="targetPlaceholder" aria-describedby="targetHelp"></textarea>
        <p class="helper" id="targetHelp" data-text="targetHelp"></p>
      </div>
    </div>
    <fieldset class="calculator-picker">
      <legend data-text="calculatorSelection"></legend>
      <div class="calculator-options">
        <label class="calculator-choice" for="includeNeo">
          <input type="checkbox" id="includeNeo" autocomplete="off" checked>
          <span data-period-name="neo"></span>
        </label>
        <label class="calculator-choice" for="includeIron">
          <input type="checkbox" id="includeIron" autocomplete="off" checked>
          <span data-period-name="iron"></span>
        </label>
        <label class="calculator-choice" for="includeColonial">
          <input type="checkbox" id="includeColonial" autocomplete="off">
          <span data-period-name="colonial"></span>
        </label>
      </div>
    </fieldset>
    <div class="actions"><button type="button" id="calcBtn" data-text="calculate"></button></div>
    <p class="status" id="status" role="status"></p>

    <details id="details">
      <summary data-text="sourceSummary"></summary>
      <div class="source-editor">
        <p class="helper" id="sourceHelp" data-text="sourceHelp"></p>
        <label for="neoSrc"><span data-period-name="neo"></span> <span class="source-count" id="nNeo"></span></label>
        <textarea id="neoSrc" rows="6" spellcheck="false" aria-describedby="sourceHelp"></textarea>
        <label for="ironSrc"><span data-period-name="iron"></span> <span class="source-count" id="nIron"></span></label>
        <textarea id="ironSrc" rows="6" spellcheck="false" aria-describedby="sourceHelp"></textarea>
        <label for="colonialSrc"><span data-period-name="colonial"></span> <span class="source-count" id="nColonial"></span></label>
        <textarea id="colonialSrc" rows="6" spellcheck="false" aria-describedby="sourceHelp"></textarea>
        <div class="actions">
          <button type="button" id="resetSources" data-text="resetSources"></button>
          <button type="button" id="exportSources" data-text="saveSources"></button>
        </div>
      </div>
    </details>

    <div class="controlgrid appearance">
      <div>
        <label for="palette" data-text="paletteLabel"></label>
        <div class="option-row">
          <span class="swatch" aria-hidden="true"></span>
          <select id="palette">
            <option value="olive" data-text="olive"></option>
            <option value="blue" data-text="blue"></option>
            <option value="amber" data-text="amber"></option>
            <option value="wine" data-text="wine"></option>
            <option value="custom" data-text="customColor"></option>
          </select>
        </div>
        <div class="custom-option" id="customColorFields" hidden>
          <label for="accentColor" data-text="accentLabel"></label>
          <input type="color" id="accentColor" value="#86a846">
        </div>
      </div>
      <div>
        <label for="scene" data-text="sceneLabel"></label>
        <select id="scene">
          <option value="historical" data-text="historical"></option>
          <option value="mountains" data-text="mountains"></option>
          <option value="coast" data-text="coast"></option>
          <option value="photo" data-text="ownPhoto"></option>
        </select>
        <div class="custom-option" id="photoFields" hidden>
          <button type="button" id="choosePhoto" data-text="choosePhoto"></button>
          <input type="file" id="photoInput" accept="image/*" hidden>
          <p class="helper photo-message" id="photoMessage" role="status"></p>
        </div>
      </div>
    </div>
  </section>

  <div class="poster-tools">
    <button type="button" class="primary" id="pngBtn" data-text="downloadPng"></button>
    <button type="button" id="copyBtn" data-text="copyResults"></button>
    <button type="button" id="zoomBtn" aria-pressed="false" data-text="zoomIn"></button>
  </div>
  <section class="posterframe" id="posterFrame" tabindex="0" data-aria="poster">
    <canvas width="1122" height="1102" id="poster" role="img" data-aria="poster"></canvas>
  </section>
  <p class="note" data-text="method"></p>
</main>
<script id="initial-iron" type="text/plain"></script>
<script id="initial-neo" type="text/plain"></script>
<script id="initial-colonial" type="text/plain"></script>

function dot(a,b){let s=0;for(let k=0;k<a.length;k++)s+=a[k]*b[k];return s;}
function projectSimplex(v){
 const sorted=[...v].sort((a,b)=>b-a);let accum=0,theta=0;
 for(let i=0;i<sorted.length;i++){
  accum+=sorted[i];const t=(accum-1)/(i+1);
  if(sorted[i]>t)theta=t;
 }
 return v.map(z=>Math.max(0,z-theta));
}
function solve(target,sources){
 const vecs=sources.map(s=>s.values),n=vecs.length,dim=target.length;
 if(!n)throw new Error('Lista de Sources vazia.');
 if(n===1){const dist=Math.sqrt(target.reduce((z,v,k)=>z+(v-vecs[0][k])**2,0));return{w:[1],distance:dist,cycles:1};}
 // L estimate for Hessian A^T A: repeated power iteration.
 let v=Array(n).fill(1/Math.sqrt(n)),L=0;
 for(let it=0;it<70;it++){
  const av=Array(dim).fill(0);
  for(let i=0;i<n;i++)for(let k=0;k<dim;k++)av[k]+=v[i]*vecs[i][k];
  const out=vecs.map(a=>dot(a,av));
  const mag=Math.hypot(...out);
  if(mag<1e-30)break;
  v=out.map(z=>z/mag);L=dot(v,out);
 }
 L=Math.max(L*1.02,1e-5);
 let w=Array(n).fill(1/n),z=[...w],tk=1,prev=Infinity,cycles=0;
 function residual(weights){
  const res=target.map(a=>-a);
  for(let i=0;i<n;i++)if(weights[i]!==0)for(let k=0;k<dim;k++)res[k]+=weights[i]*vecs[i][k];
  return res;
 }
 for(let it=0;it<12000;it++){
  cycles=it+1;
  const res=residual(z),gradient=vecs.map(row=>dot(row,res));
  const nxt=projectSimplex(z.map((a,i)=>a-gradient[i]/L));
  const newres=residual(nxt),obj=dot(newres,newres);
  if(obj>prev+1e-13){z=[...w];tk=1;prev=dot(residual(w),residual(w));continue;}
  const delta=Math.hypot(...nxt.map((x,i)=>x-w[i]));
  const nextT=(1+Math.sqrt(1+4*tk*tk))/2;
  const momentum=(tk-1)/nextT;
  z=nxt.map((x,i)=>x+momentum*(x-w[i]));
  w=nxt;tk=nextT;prev=obj;
  if(it>200 && delta<2e-11)break;
 }
 return{w,distance:Math.sqrt(dot(residual(w),residual(w))),cycles};
}

function t(key, ...args) {
  const value = messages[locale][key];
  return typeof value === 'function' ? value(...args) : value;
}

function formatSourceName(name) {
  return name.replace(/(\p{L})([\p{L}\p{M}]*)/gu, (word, first, rest) => {
    if ([...word.normalize('NFC')].length <= 2) return word.toLowerCase();
    return first.toUpperCase() + rest;
  });
}

function displayGroup(name) {
  const labels = locale === 'pt-BR' ? portugueseGroups : englishGroups;
  return formatSourceName(labels.get(name) ?? name);
}

function displayStatus() {
  $('status').textContent = t(status.key, ...status.args);
  $('status').classList.toggle('err', status.error);
}

function setStatus(key, args = [], error = false) {
  status = { key, args, error };
  displayStatus();
}

function fmtPct(weight) {
  return formats.weight.format(weight) + '%';
}

function fmtDistance(distance) {
  return formats.percentDistance.format(distance * 100) + '% / ' + formats.rawDistance.format(distance);
}

function updateLanguage(nextLocale) {
  for (const id of Object.keys(defaultTitles[locale])) {
    if ($(id).value === defaultTitles[locale][id]) $(id).value = defaultTitles[nextLocale][id];
  }
  locale = nextLocale;
  const decimalFormat = digits => new Intl.NumberFormat(locale, {
    minimumFractionDigits: digits, maximumFractionDigits: digits, useGrouping: false
  });
  formats = { weight: decimalFormat(1), percentDistance: decimalFormat(4), rawDistance: decimalFormat(8) };
  document.documentElement.lang = locale;
  document.title = t('pageTitle');
  for (const element of document.querySelectorAll('[data-text]')) element.textContent = t(element.dataset.text);
  for (const element of document.querySelectorAll('[data-period-name]')) {
    element.textContent = t('periods')[element.dataset.periodName];
  }
  for (const element of document.querySelectorAll('[data-placeholder]')) element.placeholder = t(element.dataset.placeholder);
  for (const element of document.querySelectorAll('[data-aria]')) element.setAttribute('aria-label', t(element.dataset.aria));
  displayStatus();
  refreshCounts();
  updatePhotoMessage();
  render();
}

function splitRow(line) {
  const delimiter = line.includes(',') ? ',' : /[\t;]/;
  return line.split(delimiter).map(value => value.trim());
}

function validCoordinates(values) {
  return values.length === 25 && values.every(value => value !== '' && Number.isFinite(Number(value)));
}

function parseSources(raw) {
  const sources = [];
  const errors = [];
  for (const [index, input] of raw.split(/\r?\n/).entries()) {
    const line = input.trim();
    if (!line || line.startsWith('#') || /^Sources\s*:/i.test(line)) continue;
    const [name, ...values] = splitRow(line);
    if (values.length !== 25) {
      errors.push(['coordinateCount', index + 1, values.length]);
    } else if (!name || !validCoordinates(values)) {
      errors.push(['invalidSource', index + 1]);
    } else {
      sources.push({ name, values: values.map(Number) });
    }
  }
  return { sources, errors };
}

function parseTarget(raw) {
  for (const input of raw.split(/\r?\n/)) {
    const line = input.trim().replace(/^Target\s*:\s*/i, '');
    const parts = splitRow(line);
    const name = parts.length === 26 ? parts.shift() : '';
    if (validCoordinates(parts)) return { name, values: parts.map(Number) };
  }
  return null;
}

function readSources(era) {
  const raw = $(sourceFields[era].input).value;
  if (sourceCache[era]?.raw !== raw) sourceCache[era] = { raw, ...parseSources(raw) };
  return sourceCache[era];
}

function selectedEras() {
  return eras.filter(era => $(sourceFields[era].checkbox).checked);
}

function refreshCounts() {
  for (const era of eras) {
    const { sources, errors } = readSources(era);
    const count = $(sourceFields[era].count);
    count.textContent = t('sourceCount', sources.length, errors.length);
    count.classList.toggle('err', errors.length > 0);
  }
}

function sourceGroup(name, era) {
  const rawPrefix = name.split(':', 1)[0].trim();
  if (era === 'neo') {
    const alias = neolithicAliases.get(name) ?? neolithicAliases.get(rawPrefix);
    if (alias) return alias;
  }
  const prefix = rawPrefix.replace(/[*_]+/g, ' ').trim() || name;
  const formatted = formatSourceName(prefix);
  return englishGroups.has(formatted) || portugueseGroups.has(formatted) ? formatted : prefix;
}

function fitPeriod(target, targetKey, era, parsed) {
  const cached = fitCache[era];
  if (cached?.targetKey === targetKey && cached.parsed === parsed) return cached.result;

  const fit = solve(target.values, parsed.sources);
  if (!Number.isFinite(fit.distance) || fit.w.some(weight => !Number.isFinite(weight))) {
    throw new Error('Non-finite fit');
  }
  const weights = new Map();
  for (const [index, source] of parsed.sources.entries()) {
    const group = sourceGroup(source.name, era);
    weights.set(group, (weights.get(group) ?? 0) + fit.w[index] * 100);
  }
  const rows = Array.from(weights, ([name, weight]) => ({ name, weight }))
    .filter(row => row.weight >= 0.05) // The poster rounds to one decimal place.
    .sort((a, b) => b.weight - a.weight);
  const result = { distance: fit.distance, rows };
  fitCache[era] = { targetKey, parsed, result };
  return result;
}

function finishCalculation(models, target) {
  pending = false;
  results = models;
  fittedTarget = target;
  updateButtons();
  render();
}

function calculate() {
  const target = parseTarget($('targetInput').value);
  if (!target) {
    setStatus('invalidTarget', [], true);
    finishCalculation(null, null);
    return;
  }
  const sourceLists = selectedEras().map(era => [era, readSources(era)]);
  for (const [era, { sources, errors }] of sourceLists) {
    if (errors.length || !sources.length) {
      const key = errors.length ? 'invalidSources' : 'noSources';
      setStatus(key, [era, errors.slice(0, 3)], true);
      finishCalculation(null, null);
      return;
    }
  }
  const targetKey = target.values.join(',');
  let models;
  try {
    models = Object.fromEntries(sourceLists.map(([era, parsed]) => [era, fitPeriod(target, targetKey, era, parsed)]));
  } catch {
    setStatus('calculationError', [], true);
    finishCalculation(null, null);
    return;
  }
  setStatus('ready');
  finishCalculation(models, target);
}

function queueCalculation(immediate = false) {
  clearTimeout(calculationTimer);
  if (!selectedEras().length) {
    setStatus('noCalculators');
    finishCalculation({}, null);
    return;
  }
  if (!$('targetInput').value.trim()) {
    setStatus('targetNeeded');
    finishCalculation({}, null);
    return;
  }
  pending = true;
  setStatus('calculating');
  updateButtons();
  calculationTimer = setTimeout(calculate, immediate ? 20 : 320);
}

function mix(first, second, amount) {
  const a = Number.parseInt(first.slice(1), 16);
  const b = Number.parseInt(second.slice(1), 16);
  return '#' + [16, 8, 0].map(shift => {
    const start = (a >> shift) & 255;
    const end = (b >> shift) & 255;
    return Math.round(start + (end - start) * amount).toString(16).padStart(2, '0');
  }).join('');
}

function makeTheme(accent) {
  return {
    background: mix('#0a0b0a', accent, 0.06),
    backdrop: mix('#1a1b16', accent, 0.13),
    panel: mix('#242520', accent, 0.09),
    panelBottom: mix('#10110f', accent, 0.045),
    border: mix(accent, '#cabb97', 0.68),
    accent: mix(accent, '#ebdeb9', 0.30),
    soft: mix(accent, '#f4e5c9', 0.55),
    pill: mix('#22261e', accent, 0.28),
    cream: '#f5e5d0',
    ink: '#f3eadc'
  };
}

function rect(x, y, width, height, radius, fill, stroke) {
  c.beginPath();
  c.roundRect(x, y, width, height, radius);
  if (fill) {
    c.fillStyle = fill;
    c.fill();
  }
  if (stroke) {
    c.strokeStyle = stroke;
    c.lineWidth = 1.2;
    c.stroke();
  }
}

function text(value, x, y, font, color, align = 'left', maxWidth) {
  c.font = font;
  c.textBaseline = 'alphabetic';
  c.textAlign = align;
  c.fillStyle = color;
  if (maxWidth) c.fillText(value, x, y, maxWidth);
  else c.fillText(value, x, y);
}

function wrapText(value, width, font) {
  c.font = font;
  const lines = [];
  let line = '';
  for (const word of value.split(/\s+/)) {
    const combined = line ? line + ' ' + word : word;
    if (c.measureText(combined).width <= width) {
      line = combined;
      continue;
    }
    if (line) lines.push(line);
    line = '';
    if (c.measureText(word).width <= width) {
      line = word;
      continue;
    }
    for (const character of word) {
      if (line && c.measureText(line + character).width > width) {
        lines.push(line);
        line = '';
      }
      line += character;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function drawCover(image, x, y, width, height, anchorX = 0.5, anchorY = 0.5) {
  const imageWidth = image?.naturalWidth ?? image?.width;
  const imageHeight = image?.naturalHeight ?? image?.height;
  if (!imageWidth || !imageHeight) return;
  const scale = Math.max(width / imageWidth, height / imageHeight);
  const cropWidth = width / scale;
  const cropHeight = height / scale;
  c.drawImage(image, (imageWidth - cropWidth) * anchorX, (imageHeight - cropHeight) * anchorY,
    cropWidth, cropHeight, x, y, width, height);
}

function seededRandom(seed) {
  return () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };
}

function addGrain(ctx, width, height, seed, count) {
  const random = seededRandom(seed);
  for (let i = 0; i < count; i++) {
    ctx.fillStyle = i % 3 ? 'rgba(247, 227, 194, .048)' : 'rgba(0, 0, 0, .12)';
    const size = 0.45 + random() * 1.4;
    ctx.fillRect(random() * width, random() * height, size, size);
  }
}

function createScenery(kind) {
  const landscape = document.createElement('canvas');
  landscape.width = 1122;
  landscape.height = 620;
  const ctx = landscape.getContext('2d');
  const { width, height } = landscape;
  const coast = kind === 'coast';
  const random = seededRandom(coast ? 18477 : 99803);
  const sun = coast ? { x: 750, y: 265, radius: 43 } : { x: 302, y: 241, radius: 36 };
  const horizon = coast ? 355 : 390;
  const sky = ctx.createLinearGradient(0, 0, 0, horizon + 20);
  sky.addColorStop(0, coast ? '#1b334d' : '#242943');
  sky.addColorStop(0.48, coast ? '#4c7491' : '#696481');
  sky.addColorStop(0.85, coast ? '#d5a786' : '#d08e76');
  sky.addColorStop(1, '#f0c59b');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, width, height);

  const glow = ctx.createRadialGradient(sun.x, sun.y, sun.radius, sun.x, sun.y, 230);
  glow.addColorStop(0, '#f9d6a877');
  glow.addColorStop(1, '#f9d6a800');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, width, horizon + 25);
  ctx.fillStyle = '#f8d8a8';
  ctx.beginPath();
  ctx.arc(sun.x, sun.y, sun.radius, 0, Math.PI * 2);
  ctx.fill();

  for (let i = 0; i < 24; i++) {
    const x = random() * width;
    const y = 110 + random() * 214;
    const span = 36 + random() * 280;
    const cloud = ctx.createLinearGradient(x - span, y, x + span, y);
    cloud.addColorStop(0, '#efd4b900');
    cloud.addColorStop(0.47, '#efd4b929');
    cloud.addColorStop(1, '#efd4b900');
    ctx.fillStyle = cloud;
    ctx.fillRect(x - span, y, span * 2, 1 + random() * 4);
  }

  function ridge(base, amplitude, phase, high, low) {
    const fade = ctx.createLinearGradient(0, base - amplitude, 0, base + 145);
    fade.addColorStop(0, high);
    fade.addColorStop(1, low);
    ctx.fillStyle = fade;
    ctx.beginPath();
    ctx.moveTo(0, height);
    for (let x = 0; x <= width + 4; x += 4) {
      const profile = 0.54 * Math.sin(x * 0.007 + phase)
        + 0.26 * Math.sin(x * 0.019 - phase * 0.8)
        + 0.14 * Math.sin(x * 0.052 + phase)
        + 0.06 * Math.sin(x * 0.12);
      ctx.lineTo(x, base + amplitude * profile);
    }
    ctx.lineTo(width, height);
    ctx.closePath();
    ctx.fill();
  }

  if (coast) {
    ridge(350, 61, 1.8, '#596c7a', '#3e6173');
    const ocean = ctx.createLinearGradient(0, horizon, 0, height);
    ocean.addColorStop(0, '#779c9e');
    ocean.addColorStop(0.45, '#3a6975');
    ocean.addColorStop(1, '#142f3a');
    ctx.fillStyle = ocean;
    ctx.fillRect(0, horizon, width, height - horizon);
    for (let i = 0; i < 350; i++) {
      const depth = random();
      const y = horizon + depth ** 2 * (height - horizon);
      const x = random() * width;
      const lineWidth = 7 + depth * random() * 75;
      const reflection = Math.abs(x - sun.x) < 45 + depth * 85;
      ctx.fillStyle = reflection ? '#f9cb9c4d' : '#c5e3e429';
      ctx.fillRect(x, y, lineWidth, 0.65 + depth * 0.9);
    }
    ctx.fillStyle = '#253b42';
    ctx.beginPath();
    ctx.moveTo(0, 460);
    ctx.bezierCurveTo(87, 440, 86, 490, 152, 486);
    ctx.bezierCurveTo(226, 476, 235, 527, 306, 536);
    ctx.bezierCurveTo(370, 542, 385, 596, 550, 620);
    ctx.lineTo(0, height);
    ctx.closePath();
    ctx.fill();
  } else {
    ridge(377, 131, 2.3, '#7a7888', '#696879');
    ridge(429, 106, 3.8, '#555f73', '#686f7e');
    ridge(488, 91, 0.15, '#414e57', '#34434d');
    ridge(552, 83, 1.8, '#293c3e', '#192a2b');
    ctx.fillStyle = '#142324';
    for (let i = 0; i < 45; i++) {
      const x = random() * width;
      const base = height + random() * 13;
      const size = 12 + random() * (x > 255 && x < 850 ? 26 : 74);
      ctx.beginPath();
      ctx.moveTo(x, base - size);
      ctx.lineTo(x + size * 0.23, base - size * 0.13);
      ctx.lineTo(x - size * 0.23, base - size * 0.13);
      ctx.closePath();
      ctx.fill();
    }
  }

  addGrain(ctx, width, height, 3329, 16500);
  return landscape;
}

function activeScenery() {
  const scene = $('scene').value;
  if (scene === 'historical') return null;
  if (scene === 'photo') return photoImage;
  return sceneryCache[scene] ??= createScenery(scene);
}

const grain = document.createElement('canvas');
grain.width = grain.height = 200;
addGrain(grain.getContext('2d'), grain.width, grain.height, 134377, 1650);
const grainPattern = c.createPattern(grain, 'repeat');

function drawBackdrop(height, headerHeight, scenery) {
  const background = c.createLinearGradient(0, 0, W, height);
  background.addColorStop(0, theme.backdrop);
  background.addColorStop(0.62, theme.background);
  background.addColorStop(1, '#0b0c0b');
  c.fillStyle = background;
  c.fillRect(0, 0, W, height);
  if (scenery) {
    const imageHeight = Math.min(height, Math.max(headerHeight + 190, 340));
    drawCover(scenery, 0, 0, W, imageHeight, 0.5, 0.46);
    const shade = c.createLinearGradient(0, 0, 0, imageHeight);
    shade.addColorStop(0, '#0c0f14a0');
    shade.addColorStop(0.45, '#0c0f1460');
    shade.addColorStop(1, theme.background);
    c.fillStyle = shade;
    c.fillRect(0, 0, W, imageHeight);
  }
  c.fillStyle = grainPattern;
  c.fillRect(0, 0, W, height);
}

function planHeader() {
  const title = $('titleInput').value.trim() || defaultTitles[locale].titleInput;
  const mainFont = 'bold 45px Georgia, serif';
  const secondaryFont = 'italic 24px Georgia, serif';
  const mainLines = wrapText(title, 802, mainFont);
  const secondaryLines = ['subtitleInput', 'thirdTitleInput'].flatMap(id => {
    const value = $(id).value.trim();
    return value ? wrapText(value, 760, secondaryFont) : [];
  });
  const titleBottom = 66 + (mainLines.length - 1) * 48;
  const detailsY = titleBottom + 45;
  const lastLine = secondaryLines.length ? detailsY + (secondaryLines.length - 1) * 29 : titleBottom;
  return { mainLines, mainFont, secondaryLines, secondaryFont, detailsY, height: Math.max(151, lastLine + 28) };
}

function drawHeader(header) {
  header.mainLines.forEach((line, i) => text(line, W / 2, 66 + i * 48, header.mainFont, theme.cream, 'center'));
  header.secondaryLines.forEach((line, i) => {
    text(line, W / 2, header.detailsY + i * 29, header.secondaryFont, theme.soft, 'center');
  });
}

const labelFont = '19px Georgia, serif';
const headingFont = 'bold 33px Georgia, serif';
const headingWidth = 298;
const labelX = 568;
const trackX = 873;
const trackWidth = 195;
const dividerX = 390;

function planCard(era) {
  const data = results[era];
  const artHeight = cards[era].artHeight;
  const heading = wrapText(t('periods')[era], headingWidth, headingFont);
  const headingY = artHeight + 40;
  const distanceY = headingY + (heading.length - 1) * 34 + 36;
  const rows = (data?.rows ?? []).map(row => {
    const lines = wrapText(displayGroup(row.name), trackX - labelX - 18, labelFont);
    return { ...row, lines, height: Math.max(36, lines.length * 22 + 10) };
  });
  const rowsHeight = rows.reduce((sum, row) => sum + row.height, 0);
  const height = Math.max(distanceY + 66, rowsHeight + 24);
  return { era, rows, rowsHeight, height, heading, headingY, distanceY, artHeight, distance: data?.distance ?? null };
}

function drawCard(card, y, scenery) {
  const { era, rows, rowsHeight, height, heading, headingY, distanceY, artHeight, distance } = card;
  const x = 26;
  const width = W - 2 * x;
  const fill = c.createLinearGradient(0, y, 0, y + height);
  fill.addColorStop(0, theme.panel);
  fill.addColorStop(0.54, theme.panelBottom);
  fill.addColorStop(1, theme.panelBottom);
  rect(x, y, width, height, 18, fill);

  c.save();
  c.clip();
  const artWidth = dividerX - x - 1;
  const backdrop = scenery || images[era];
  const [cropX, cropY] = scenery ? cards[era].crop : [0.5, 0.44];
  drawCover(backdrop, x + 1, y + 1, artWidth, artHeight + 15, cropX, cropY);
  const fade = c.createLinearGradient(0, y + artHeight - 39, 0, y + artHeight + 20);
  fade.addColorStop(0, theme.panelBottom + '00');
  fade.addColorStop(1, theme.panelBottom);
  c.fillStyle = fade;
  c.fillRect(x + 1, y + artHeight - 39, artWidth, 60);
  c.restore();
  rect(x, y, width, height, 18, null, theme.border);

  c.fillStyle = theme.accent + '72';
  c.fillRect(dividerX, y + 17, 1.5, height - 34);
  c.fillStyle = theme.accent;
  c.fillRect(52, y + headingY - 24, 4, 31 + (heading.length - 1) * 34);
  heading.forEach((line, index) => {
    text(line, 72, y + headingY + index * 34, headingFont, theme.cream, 'left', headingWidth);
  });
  if (distance === null) {
    text(t('periodNeedsTarget'), 743, y + height / 2, labelFont, theme.soft, 'center', 600);
    return;
  }
  text(t('distance'), 72, y + distanceY, 'italic 20px Georgia, serif', theme.soft);
  rect(65, y + distanceY + 9, 292, 38, 9, theme.pill);
  text(fmtDistance(distance), 80, y + distanceY + 36, '25px Georgia, serif', theme.ink, 'left', 262);

  let rowY = y + (height - rowsHeight) / 2;
  const max = Math.max(1, ...rows.map(row => row.weight));
  for (const row of rows) {
    const center = rowY + row.height / 2;
    rect(468, center - 14, 83, 28, 8, theme.pill);
    text(fmtPct(row.weight), 509.5, center + 6, 'bold 18px Georgia, serif', theme.ink, 'center');
    text(icons.get(row.name) ?? '✦', 432, center + 8, '23px Georgia, serif', theme.soft, 'center');
    row.lines.forEach((line, index) => {
      const baseline = center + 6 + (index - (row.lines.length - 1) / 2) * 22;
      text(line, labelX, baseline, labelFont, theme.ink);
    });
    rect(trackX, center - 11, trackWidth, 22, 8, '#2a2b2b');
    const barWidth = Math.max(3, (trackWidth - 4) * row.weight / max);
    rect(trackX + 2, center - 9, barWidth, 18, Math.min(6, barWidth / 2), theme.accent);
    rowY += row.height;
  }
  if (!rows.length) text(t('noVisibleRows'), 743, y + height / 2, labelFont, theme.soft, 'center');
}

function render() {
  const header = planHeader();
  const selected = selectedEras();
  const sections = results ? selected.map(planCard) : [];
  const cardGap = 15;
  const height = sections.length
    ? header.height + sections.reduce((sum, card) => sum + card.height + cardGap, 0)
    : header.height + 117;
  if (canvas.height !== height) canvas.height = height;
  const scenery = activeScenery();
  drawBackdrop(height, header.height, scenery);
  drawHeader(header);
  let y = header.height;
  for (const card of sections) {
    drawCard(card, y, scenery);
    y += card.height + cardGap;
  }
  if (!sections.length) {
    rect(26, y, W - 52, 84, 15, theme.panelBottom, theme.border);
    text(t(selected.length ? 'noResults' : 'noCalculators'), W / 2, y + 50, '22px Georgia, serif', theme.soft, 'center');
  }
}

function updateAppearance() {
  const palette = $('palette').value;
  const custom = palette === 'custom';
  const accent = custom ? $('accentColor').value : palettes[palette];
  theme = makeTheme(accent);
  document.documentElement.style.setProperty('--accent', theme.accent);
  document.documentElement.style.setProperty('--accent-light', theme.soft);
  $('customColorFields').hidden = !custom;
  $('photoFields').hidden = $('scene').value !== 'photo';
  updateButtons();
  render();
}

function updatePhotoMessage() {
  $('photoMessage').textContent = photoStatus ? t(photoStatus) : photoName;
  $('photoMessage').classList.toggle('photo-error', photoStatus === 'photoError');
}

async function loadPhoto() {
  const file = $('photoInput').files[0];
  if (!file) return;
  const request = ++photoRequest;
  const url = URL.createObjectURL(file);
  const photo = new Image();
  photoStatus = 'photoLoading';
  updatePhotoMessage();
  updateButtons();
  try {
    photo.src = url;
    await photo.decode();
    if (request !== photoRequest) return;
    photoImage = photo;
    photoName = file.name;
    photoStatus = '';
  } catch {
    if (request !== photoRequest) return;
    photoStatus = 'photoError';
  } finally {
    URL.revokeObjectURL(url);
  }
  updatePhotoMessage();
  updateButtons();
  render();
}


function updateButtons() {
  const waitingForPhoto = $('scene').value === 'photo' && photoStatus === 'photoLoading';
  $('calcBtn').disabled = !selectedEras().length;
  $('pngBtn').disabled = !fittedTarget || pending || artworkLoading || waitingForPhoto;
  $('copyBtn').disabled = !fittedTarget || pending;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function downloadPoster() {
  if ($('pngBtn').disabled) return;
  const filename = locale === 'en' ? 'G25_Poster_EN.png' : 'G25_Poster_PT-BR.png';
  try {
    canvas.toBlob(blob => {
      if (blob) downloadBlob(blob, filename);
      else setStatus('pngError', [], true);
    }, 'image/png');
  } catch {
    setStatus('pngError', [], true);
  }
}

function fallbackCopy(value) {
  const field = document.createElement('textarea');
  field.value = value;
  field.readOnly = true;
  field.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
  document.body.append(field);
  field.select();
  let copied = false;
  try {
    copied = document.execCommand('copy');
  } finally {
    field.remove();
  }
  if (!copied) throw new Error('Clipboard unavailable');
}

async function copyResults() {
  if ($('copyBtn').disabled) return;
  const heading = t('targetName') + ' · ' + (fittedTarget.name || 'G25');
  const lines = [heading, ''];
  for (const era of selectedEras()) {
    lines.push(t('periods')[era]);
    const { distance, rows } = results[era];
    lines.push(t('distance') + ' · ' + fmtDistance(distance));
    for (const row of rows) lines.push(fmtPct(row.weight) + '\t' + displayGroup(row.name));
    lines.push('');
  }
  const value = lines.join('\n');
  try {
    if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
    await navigator.clipboard.writeText(value);
    setStatus('copied');
  } catch {
    try {
      fallbackCopy(value);
      setStatus('copied');
    } catch {
      setStatus('copyError', [], true);
    }
  }
}

function exportSources() {
  const parts = eras.map(era => '### ' + t('periods')[era] + '\n' + readSources(era).raw);
  downloadBlob(new Blob([parts.join('\n\n')], { type: 'text/plain;charset=utf-8' }), 'G25_Sources.txt');
}

function onSourceEdit() {
  refreshCounts();
  queueCalculation();
}

for (const era of eras) {
  const input = $(sourceFields[era].input);
  const checkbox = $(sourceFields[era].checkbox);
  input.value = initialSources[era];
  input.addEventListener('input', () => {
    if (checkbox.checked) onSourceEdit();
    else refreshCounts();
  });
  checkbox.addEventListener('change', () => {
    queueCalculation(true);
    if (pending) render();
  });
}
for (const [id, value] of Object.entries(defaultTitles[locale])) $(id).value = value;
for (const id of ['titleInput', 'subtitleInput', 'thirdTitleInput']) $(id).addEventListener('input', render);
$('language').addEventListener('change', event => updateLanguage(event.target.value));
$('targetInput').addEventListener('input', () => queueCalculation());
$('calcBtn').addEventListener('click', () => queueCalculation(true));
$('resetSources').addEventListener('click', () => {
  for (const era of eras) $(sourceFields[era].input).value = initialSources[era];
  onSourceEdit();
});
$('exportSources').addEventListener('click', exportSources);
$('palette').addEventListener('change', updateAppearance);
$('accentColor').addEventListener('input', updateAppearance);
$('scene').addEventListener('change', updateAppearance);
$('choosePhoto').addEventListener('click', () => $('photoInput').click());
$('photoInput').addEventListener('change', loadPhoto);
$('pngBtn').addEventListener('click', downloadPoster);
$('copyBtn').addEventListener('click', copyResults);
$('zoomBtn').addEventListener('click', event => {
  const zoomed = canvas.classList.toggle('zoom');
  event.currentTarget.setAttribute('aria-pressed', String(zoomed));
  event.currentTarget.dataset.text = zoomed ? 'zoomOut' : 'zoomIn';
  event.currentTarget.textContent = t(event.currentTarget.dataset.text);
  if (!zoomed) $('posterFrame').scrollLeft = 0;
});

updateLanguage(locale);
updateAppearance();
Promise.all(Object.entries(art).map(([key, source]) => new Promise(resolve => {
  const image = new Image();
  images[key] = image;
  image.onload = image.onerror = resolve;
  image.src = source;
}))).then(() => {
  artworkLoading = false;
  updateButtons();
  render();
});

</script>
</body>
</html>
